name: Build signed APK

on:
  push:            # every push (including main) builds and uploads a signed APK
  workflow_dispatch:

permissions:
  contents: write   # to publish GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform 37.2
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"

      - name: Unit tests (puzzle logic, chess rules, alarm state machine)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build signed release APK
        env:
          # Signed with the keystore committed in app/signing. No secrets needed.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "chess-alarm-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk chess-alarm.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-alarm-apk
          path: chess-alarm-*.apk
          retention-days: 90

      # Pushes to the default branch become a public release anyone can download without a GitHub
      # account. The asset is always named chess-alarm.apk, so this link always gets the newest build:
      # https://github.com/<owner>/<repo>/releases/latest/download/chess-alarm.apk
      - name: Publish release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${GITHUB_RUN_NUMBER}" chess-alarm.apk \
            --target "${GITHUB_SHA}" \
            --title "Chess Alarm 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Built from ${GITHUB_SHA::7}. Download chess-alarm.apk on your Android phone (Android 8.0+) and open it to install." \
            --latest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
